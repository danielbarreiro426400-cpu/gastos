<!DOCTYPE html>
<html lang="gl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d5e58">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Os meus gastos</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  /* Aviso de copia */
  .banner { background: var(--card); border-radius: 18px; padding: 14px; margin-bottom: 14px; box-shadow: var(--shadow); display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; align-items: center; border-left: 4px solid var(--warn); }
  .banner .e { font-size: 1.6rem; grid-row: span 2; }
  .banner p { margin: 0; font-size: .86rem; }
  .banner .btns { grid-column: 2; display: flex; gap: 8px; margin-top: 6px; }
  .banner button { font: inherit; font-size: .8rem; font-weight: 600; border: 0; border-radius: 999px; padding: 7px 14px; }
  /* Rápidos */
  .quick { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
  .quick:empty { display: none; }
  .quick button { font: inherit; font-size: .8rem; white-space: nowrap; border: 0; background: var(--soft); color: var(--text); padding: 8px 12px; border-radius: 999px; display: flex; align-items: center; gap: 6px; }
  .quick button b { font-weight: 650; }
  [hidden] { display: none !important; }
  /* Débenme */
  #owedTotal { color: var(--warn); font-weight: 700; }
  .owed-fields { display: grid; gap: 10px; }
  .owed-person { background: var(--soft); border-radius: 16px; padding: 12px; margin-bottom: 10px; }
  .owed-person:last-child { margin-bottom: 0; }
  .owed-head { display: flex; align-items: center; gap: 12px; margin-bottom: 6px; }
  .owed-head .info { flex: 1; min-width: 0; }
  .owed-head small { display: block; font-size: .75rem; color: var(--muted); }
  .owed-head .amt { font-weight: 700; color: var(--warn); }
  .owed-item { display: grid; grid-template-columns: 1fr auto auto; gap: 10px; align-items: center; font-size: .85rem; padding: 7px 0; border-top: 1px solid var(--line); }
  .owed-item span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--muted); }
  .owed-item button { border: 0; background: color-mix(in srgb, var(--ok) 15%, transparent); color: var(--ok); border-radius: 10px; padding: 6px 10px; font: inherit; font-size: .78rem; font-weight: 600; }
  .owed-all { width: 100%; margin-top: 8px; border: 0; border-radius: 12px; padding: 10px; font: inherit; font-size: .85rem; font-weight: 600; background: var(--card); color: var(--text); }
  .item .amt.owed { color: var(--muted); }
  .tag.pend { background: color-mix(in srgb, var(--warn) 18%, transparent); }
  .tag.done { background: color-mix(in srgb, var(--ok) 15%, transparent); }
  :root {
    --bg: #f2f4f3; --card: #ffffff; --text: #17201f; --muted: #6b7774; --line: #e7ebea; --soft: #f5f7f6;
    --accent: #0f766e; --accent-dark: #0d5e58; --accent-2: #14b8a6;
    --danger: #e0435b; --warn: #f59e0b; --ok: #10a36b;
    --shadow: 0 1px 2px rgba(16,24,22,.04), 0 6px 20px rgba(16,24,22,.06);
    --radius: 20px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0e1312; --card: #171e1d; --text: #e8eeec; --muted: #93a19d; --line: #25302e; --soft: #1d2625;
      --danger: #ff6b81; --warn: #fbbf24; --ok: #34d399; --shadow: 0 1px 2px rgba(0,0,0,.3);
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { background: var(--bg); }
  body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); padding-bottom: 110px; font-variant-numeric: tabular-nums; }
  button { cursor: pointer; transition: transform .12s ease, background .15s ease; }
  button:active { transform: scale(.96); }

  /* Cabeceira */
  header {
    background: radial-gradient(120% 140% at 0% 0%, #1aa596 0%, var(--accent) 45%, var(--accent-dark) 100%);
    color: #fff; padding: 16px 18px 64px; padding-top: max(16px, env(safe-area-inset-top));
    border-radius: 0 0 32px 32px;
  }
  .top { display: flex; align-items: center; justify-content: space-between; max-width: 640px; margin: 0 auto; }
  .brand { font-size: .95rem; font-weight: 600; opacity: .95; display: flex; align-items: center; gap: 8px; }
  .brand i { font-style: normal; width: 30px; height: 30px; border-radius: 10px; background: rgba(255,255,255,.18); display: grid; place-items: center; }
  .month-nav { display: flex; align-items: center; gap: 4px; background: rgba(255,255,255,.14); border-radius: 999px; padding: 3px; }
  .month-nav button { background: none; color: #fff; border: 0; border-radius: 50%; width: 32px; height: 32px; font-size: 1.1rem; line-height: 1; }
  .month-nav button:hover { background: rgba(255,255,255,.15); }
  .month-label { font-size: .85rem; text-transform: capitalize; min-width: 104px; text-align: center; font-weight: 500; }
  .hero { text-align: center; margin: 22px auto 0; max-width: 640px; }
  .hero .label { font-size: .8rem; opacity: .8; letter-spacing: .02em; }
  .hero .amount { font-size: 2.7rem; font-weight: 750; letter-spacing: -.02em; margin-top: 2px; }
  .hero .cmp { display: inline-flex; align-items: center; gap: 4px; margin-top: 6px; font-size: .78rem; background: rgba(255,255,255,.16); padding: 4px 10px; border-radius: 999px; }

  main { padding: 0 14px; max-width: 640px; margin: -44px auto 0; position: relative; }
  .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 14px; }
  .stat { background: var(--card); border-radius: 18px; padding: 14px; box-shadow: var(--shadow); display: flex; gap: 10px; align-items: center; }
  .stat .dot { width: 38px; height: 38px; border-radius: 12px; display: grid; place-items: center; font-size: 1.1rem; flex: none; }
  .stat small { display: block; font-size: .74rem; color: var(--muted); }
  .stat b { font-size: 1.02rem; }

  .card { background: var(--card); border-radius: var(--radius); padding: 16px; margin-bottom: 14px; box-shadow: var(--shadow); }
  .card h2 { font-size: .95rem; margin: 0 0 14px; font-weight: 650; display: flex; justify-content: space-between; align-items: center; }
  .card h2 button { font: inherit; font-size: .8rem; font-weight: 600; color: var(--accent); background: color-mix(in srgb, var(--accent) 10%, transparent); border: 0; padding: 6px 12px; border-radius: 999px; }
  @media (prefers-color-scheme: dark) { .card h2 button { color: var(--accent-2); } }

  /* Orzamento */
  .budget-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 10px; }
  .budget-head .big { font-size: 1.3rem; font-weight: 700; }
  .budget-head .of { font-size: .85rem; color: var(--muted); }
  .pill { font-size: .78rem; font-weight: 600; padding: 4px 10px; border-radius: 999px; }
  .pill.ok { color: var(--ok); background: color-mix(in srgb, var(--ok) 13%, transparent); }
  .pill.warn { color: var(--warn); background: color-mix(in srgb, var(--warn) 15%, transparent); }
  .pill.over { color: var(--danger); background: color-mix(in srgb, var(--danger) 13%, transparent); }
  .bar { height: 8px; background: var(--soft); border-radius: 99px; overflow: hidden; }
  .bar span { display: block; height: 100%; border-radius: 99px; transition: width .5s cubic-bezier(.2,.8,.2,1); }
  .bar.big { height: 12px; }
  .bar .ok { background: linear-gradient(90deg, #34d399, var(--ok)); }
  .bar .warn { background: linear-gradient(90deg, #fcd34d, var(--warn)); }
  .bar .over { background: linear-gradient(90deg, #fb7185, var(--danger)); }
  .budget-foot { font-size: .78rem; color: var(--muted); margin-top: 8px; }

  /* Categorías */
  .donut-wrap { display: flex; justify-content: center; margin: 2px 0 16px; }
  .donut { position: relative; width: 168px; height: 168px; }
  .donut svg { width: 100%; height: 100%; transform: rotate(-90deg); }
  .donut circle { fill: none; stroke-width: 4.2; transition: stroke-dasharray .6s ease; }
  .donut .center { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; }
  .donut .center small { font-size: .72rem; color: var(--muted); }
  .donut .center b { font-size: 1.15rem; }
  .cat-row { display: grid; grid-template-columns: 40px 1fr auto; gap: 2px 12px; align-items: center; padding: 8px 0; }
  .cat-row .chip { grid-row: span 2; }
  .cat-row .name { font-size: .92rem; font-weight: 550; }
  .cat-row .val { font-weight: 650; text-align: right; font-size: .92rem; }
  .cat-row .line2 { grid-column: 2 / 4; display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: center; font-size: .74rem; color: var(--muted); }
  .chip { width: 40px; height: 40px; border-radius: 13px; display: grid; place-items: center; font-size: 1.2rem; flex: none; }
  .up { color: var(--danger); } .down { color: var(--ok); }

  /* Movementos */
  .day { display: flex; justify-content: space-between; font-size: .74rem; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; margin: 14px 0 2px; }
  .day:first-child { margin-top: 0; }
  .item { display: flex; align-items: center; gap: 12px; padding: 9px 6px; margin: 0 -6px; border-radius: 14px; }
  .item:hover { background: var(--soft); }
  .item .info { flex: 1; min-width: 0; }
  .item .desc { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: .93rem; font-weight: 550; }
  .item .meta { font-size: .76rem; color: var(--muted); margin-top: 1px; }
  .item .amt { font-weight: 650; white-space: nowrap; font-size: .95rem; }
  .item .amt.inc { color: var(--ok); }
  .item .del { background: none; border: 0; color: var(--muted); padding: 6px; border-radius: 10px; opacity: .55; display: grid; place-items: center; }
  .item .del:hover { opacity: 1; background: color-mix(in srgb, var(--danger) 12%, transparent); color: var(--danger); }
  .item .del svg { width: 18px; height: 18px; }
  .tag { display: inline-block; font-size: .68rem; padding: 1px 6px; border-radius: 6px; background: var(--soft); margin-left: 4px; }
  .empty { color: var(--muted); text-align: center; padding: 18px 8px; font-size: .88rem; line-height: 1.45; }
  .empty .e { font-size: 2rem; display: block; margin-bottom: 6px; }

  /* Botón flotante */
  .fab { position: fixed; left: 50%; transform: translateX(-50%); bottom: max(20px, env(safe-area-inset-bottom)); height: 58px; padding: 0 26px 0 20px; border-radius: 999px; border: 0;
    background: linear-gradient(135deg, #1aa596, var(--accent-dark)); color: #fff; font: inherit; font-size: 1rem; font-weight: 650;
    box-shadow: 0 8px 24px rgba(13,94,88,.4); display: flex; align-items: center; gap: 8px; z-index: 5; }
  .fab:active { transform: translateX(-50%) scale(.96); }
  .fab span { font-size: 1.6rem; font-weight: 400; line-height: 1; }

  /* Follas inferiores */
  dialog { border: 0; padding: 0; width: 100%; max-width: 520px; max-height: 92vh; margin: auto auto 0; border-radius: 26px 26px 0 0; background: var(--card); color: var(--text); }
  dialog[open] { animation: up .28s cubic-bezier(.2,.8,.2,1); }
  dialog::backdrop { background: rgba(8,14,13,.5); backdrop-filter: blur(2px); }
  @keyframes up { from { transform: translateY(40px); opacity: 0; } }
  @media (min-width: 600px) { dialog { margin: auto; border-radius: 26px; } }
  form { padding: 10px 18px 20px; padding-bottom: max(20px, env(safe-area-inset-bottom)); display: grid; gap: 14px; }
  .grab { width: 40px; height: 5px; border-radius: 9px; background: var(--line); margin: 0 auto 2px; }
  form h3 { margin: 0; font-size: 1.05rem; text-align: center; }
  label { font-size: .8rem; color: var(--muted); display: grid; gap: 6px; font-weight: 500; }
  label.check { display: flex; align-items: center; gap: 10px; color: var(--text); font-size: .9rem; background: var(--soft); padding: 12px; border-radius: 14px; }
  label.check input { width: 20px; height: 20px; accent-color: var(--accent); margin: 0; }
  input { font: inherit; padding: 13px 14px; border-radius: 14px; border: 1.5px solid transparent; background: var(--soft); color: var(--text); width: 100%; outline: none; transition: border-color .15s; }
  input:focus { border-color: var(--accent-2); }
  .amount-box { text-align: center; }
  .amount-box input { font-size: 2.2rem; font-weight: 700; text-align: center; background: none; padding: 4px; letter-spacing: -.02em; }
  .amount-box input::placeholder { color: var(--line); }
  .seg { display: grid; grid-template-columns: 1fr 1fr; background: var(--soft); border-radius: 14px; padding: 4px; }
  .seg button { font: inherit; font-size: .9rem; border: 0; padding: 10px; border-radius: 11px; background: none; color: var(--muted); font-weight: 600; }
  .seg button.sel { background: var(--card); color: var(--text); box-shadow: 0 1px 4px rgba(0,0,0,.1); }
  .seg button.sel[data-type="gasto"] { color: var(--danger); }
  .seg button.sel[data-type="ingreso"] { color: var(--ok); }
  .cats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .cats button { font: inherit; font-size: .7rem; padding: 8px 2px 7px; border-radius: 14px; border: 1.5px solid transparent; background: none; color: var(--text); display: grid; justify-items: center; gap: 4px; }
  .cats button .chip { width: 44px; height: 44px; border-radius: 14px; }
  .cats button.sel { border-color: var(--accent-2); background: color-mix(in srgb, var(--accent-2) 9%, transparent); font-weight: 600; }
  .actions { display: grid; grid-template-columns: 1fr 2fr; gap: 10px; margin-top: 2px; }
  .actions button { font: inherit; padding: 15px; border-radius: 16px; border: 0; font-weight: 600; }
  .primary { background: linear-gradient(135deg, #1aa596, var(--accent-dark)); color: #fff; }
  .secondary { background: var(--soft); color: var(--text); }
  .budget-grid { display: grid; grid-template-columns: 1fr 110px; gap: 8px 12px; align-items: center; font-size: .9rem; }
  .budget-grid .n { display: flex; align-items: center; gap: 10px; }
  .budget-grid .chip { width: 32px; height: 32px; border-radius: 10px; font-size: 1rem; }
  .budget-grid input { padding: 9px 12px; text-align: right; }
  .hint { font-size: .8rem; color: var(--muted); margin: -6px 0 0; text-align: center; }
  .tools { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .tools button, .tools label.btn { font: inherit; font-size: .78rem; font-weight: 550; padding: 12px 6px; border-radius: 14px; border: 0; background: var(--soft); color: var(--text); cursor: pointer; display: grid; justify-items: center; gap: 4px; text-align: center; }
  .tools .i { font-size: 1.2rem; }
</style>
</head>
<body>
<header>
  <div class="top">
    <div class="brand"><i>💶</i>Os meus gastos</div>
    <div class="month-nav">
      <button id="prev" aria-label="Mes anterior">‹</button>
      <div class="month-label" id="monthLabel"></div>
      <button id="next" aria-label="Mes seguinte">›</button>
    </div>
  </div>
  <div class="hero">
    <div class="label">Gastado este mes</div>
    <div class="amount" id="total"></div>
    <div class="cmp" id="sumCmp"></div>
  </div>
</header>

<main>
  <div id="backupBanner"></div>
  <div class="stats">
    <div class="stat"><div class="dot" style="background:color-mix(in srgb,var(--ok) 14%,transparent)">⬇️</div><div><small>Ingresos</small><b id="sumInc"></b></div></div>
    <div class="stat"><div class="dot" style="background:color-mix(in srgb,var(--accent-2) 14%,transparent)">🐷</div><div><small>Saldo</small><b id="sumBal"></b></div></div>
  </div>

  <section class="card" id="owedCard" hidden>
    <h2>👪 Débenme <span id="owedTotal"></span></h2>
    <div id="owedList"></div>
  </section>
  <section class="card">
    <h2>Orzamento <button id="editBudget">Axustar</button></h2>
    <div id="budget"></div>
  </section>
  <section class="card">
    <h2>Por categoría</h2>
    <div id="byCat"></div>
  </section>
  <section class="card">
    <h2>Movementos</h2>
    <div id="list"></div>
  </section>
  <section class="card">
    <h2>Fixos de cada mes</h2>
    <div id="recList"></div>
  </section>
  <section class="card">
    <h2>Copia de seguridade</h2>
    <div class="tools">
      <button id="exportCsv"><span class="i">📊</span>Exportar CSV</button>
      <button id="exportJson"><span class="i">💾</span>Gardar copia</button>
      <label class="btn"><span class="i">📂</span>Restaurar<input type="file" id="importJson" accept=".json,application/json" hidden></label>
    </div>
  </section>
</main>

<button class="fab" id="add" aria-label="Engadir"><span>+</span>Engadir</button>

<dialog id="dlg">
  <form id="form" method="dialog">
    <div class="grab"></div>
    <h3 id="formTitle">Novo movemento</h3>
    <div class="seg" id="typeSeg">
      <button type="button" data-type="gasto">Gasto</button>
      <button type="button" data-type="ingreso">Ingreso</button>
    </div>
    <div class="amount-box"><input id="amount" type="number" inputmode="decimal" step="0.01" min="0.01" placeholder="0,00 €" required></div>
    <div class="quick" id="quick"></div>
    <div class="cats" id="cats"></div>
    <label>Descrición<input id="desc" type="text" placeholder="Ex.: compra no super" maxlength="80" list="descList" autocomplete="off"></label>
    <datalist id="descList"></datalist>
    <label class="check" id="owedWrap"><input type="checkbox" id="owed"> 👪 Mo teñen que devolver</label>
    <div class="owed-fields" id="owedFields" hidden>
      <label>Quen cho debe?<input id="owedWho" type="text" list="whoList" placeholder="Ex.: Pais" maxlength="40" autocomplete="off"></label>
      <datalist id="whoList"></datalist>
      <label class="check"><input type="checkbox" id="owedPaid"> ✅ Xa mo devolveron</label>
    </div>
    <label>Data<input id="date" type="date" required></label>
    <label class="check" id="repeatWrap"><input type="checkbox" id="repeat"> 🔁 Repetir cada mes</label>
    <div class="actions">
      <button type="button" class="secondary" id="cancel">Cancelar</button>
      <button type="submit" class="primary">Gardar</button>
    </div>
  </form>
</dialog>

<dialog id="budgetDlg">
  <form id="budgetForm" method="dialog">
    <div class="grab"></div>
    <h3>Orzamento mensual</h3>
    <p class="hint">Deixa en branco o que non queiras limitar.</p>
    <label>Total ao mes<input id="budgetTotal" type="number" inputmode="decimal" step="1" min="0" placeholder="Sen límite"></label>
    <div class="budget-grid" id="budgetCats"></div>
    <div class="actions">
      <button type="button" class="secondary" id="budgetCancel">Cancelar</button>
      <button type="submit" class="primary">Gardar</button>
    </div>
  </form>
</dialog>

<script>
// [id, icona, nome, cor]
const CATS = {
  gasto: [
    ['comida', '🛒', 'Comida', '#22c55e'], ['restaurante', '🍽️', 'Bares', '#f97316'], ['transporte', '🚗', 'Transporte', '#3b82f6'], ['casa', '🏠', 'Casa', '#8b5cf6'],
    ['facturas', '💡', 'Facturas', '#eab308'], ['saude', '💊', 'Saúde', '#ef4444'], ['lecer', '🎉', 'Lecer', '#ec4899'], ['roupa', '👕', 'Roupa', '#06b6d4'],
    ['regalos', '🎁', 'Regalos', '#f43f5e'], ['subscricions', '📱', 'Subscr.', '#6366f1'], ['educacion', '📚', 'Estudos', '#0ea5e9'], ['outros', '📦', 'Outros', '#94a3b8']
  ],
  ingreso: [['nomina', '💼', 'Nómina', '#10b981'], ['extra', '💰', 'Extra', '#84cc16'], ['venda', '🏷️', 'Vendas', '#14b8a6'], ['outrosI', '➕', 'Outros', '#64748b']]
};
const ALL_CATS = [...CATS.gasto, ...CATS.ingreso];
const catInfo = id => ALL_CATS.find(c => c[0] === id) || CATS.gasto[CATS.gasto.length - 1];
const chip = (c, cls = 'chip') => `<div class="${cls}" style="background:color-mix(in srgb, ${c[3]} 16%, transparent)">${c[1]}</div>`;
const TRASH = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/></svg>';
const CROSS = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>';

const KEY = 'gastos.v1', CFG_KEY = 'gastos.config.v1';
const eur = n => n.toLocaleString('gl-ES', { style: 'currency', currency: 'EUR' });
const $ = id => document.getElementById(id);
const esc = s => s.replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const isInc = g => g.type === 'ingreso';

let gastos = JSON.parse(localStorage.getItem(KEY) || '[]');
let cfg = Object.assign({ budget: 0, catBudgets: {}, recurrentes: [] }, JSON.parse(localStorage.getItem(CFG_KEY) || '{}'));
let view = new Date(); view.setDate(1);
let editingId = null, selCat = 'comida', selType = 'gasto';
let nextId = Date.now();
const newId = () => (nextId = Math.max(nextId + 1, Date.now()));

const save = () => { localStorage.setItem(KEY, JSON.stringify(gastos)); localStorage.setItem(CFG_KEY, JSON.stringify(cfg)); };
const today = () => { const d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0, 10); };
const keyOf = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
const addMonths = (key, n) => { const [y, m] = key.split('-').map(Number); return keyOf(new Date(y, m - 1 + n, 1)); };
const monthKey = () => keyOf(view);

// Crea os movementos fixos que falten ata o mes actual
function runRecurring() {
  const now = today().slice(0, 7);
  let changed = false;
  for (const r of cfg.recurrentes) {
    let m = addMonths(r.last, 1);
    while (m <= now) {
      const [y, mo] = m.split('-').map(Number);
      const day = Math.min(r.day, new Date(y, mo, 0).getDate());
      gastos.push({ id: newId(), type: r.type, amount: r.amount, cat: r.cat, desc: r.desc, date: `${m}-${String(day).padStart(2, '0')}`, recId: r.id });
      r.last = m; changed = true;
      m = addMonths(m, 1);
    }
  }
  if (changed) save();
}

function monthData(key) {
  const items = gastos.filter(g => g.date.startsWith(key));
  // O que adiantas por outros non conta como gasto teu
  const exp = items.filter(g => !isInc(g) && !g.owed);
  const byCat = {};
  exp.forEach(g => byCat[g.cat] = (byCat[g.cat] || 0) + g.amount);
  return { items, expTotal: exp.reduce((s, g) => s + g.amount, 0), incTotal: items.filter(isInc).reduce((s, g) => s + g.amount, 0), byCat };
}
const levelClass = f => f >= 1 ? 'over' : f >= 0.8 ? 'warn' : 'ok';
const pct = (cur, prev) => prev ? Math.round((cur - prev) / prev * 100) : null;
function pctTag(cur, prev) {
  const p = pct(cur, prev);
  if (p === null) return '';
  return `<span class="${p > 0 ? 'up' : p < 0 ? 'down' : ''}">${p > 0 ? '▲' : p < 0 ? '▼' : '='} ${Math.abs(p)} %</span>`;
}

function donut(rows, total) {
  let acc = 0;
  const segs = rows.filter(([, v]) => v > 0).map(([c, v]) => {
    const p = v / total * 100, gap = rows.length > 1 ? 0.8 : 0;
    const s = `<circle r="15.915" cx="20" cy="20" stroke="${catInfo(c)[3]}" stroke-dasharray="${Math.max(p - gap, 0.01)} ${100 - p + gap}" stroke-dashoffset="${-acc}" stroke-linecap="butt"/>`;
    acc += p; return s;
  }).join('');
  return `<div class="donut-wrap"><div class="donut"><svg viewBox="0 0 40 40"><circle r="15.915" cx="20" cy="20" stroke="var(--soft)"/>${segs}</svg>
    <div class="center"><small>Total</small><b>${eur(total)}</b></div></div></div>`;
}

// Aviso para gardar copia (cada 30 días, pódese adiar 7)
const daysSince = d => d ? Math.floor((new Date(today()) - new Date(d)) / 864e5) : Infinity;
function renderBanner() {
  const need = gastos.length >= 5 && daysSince(cfg.lastBackup) >= 30 && daysSince(cfg.backupSnooze) >= 7;
  $('backupBanner').innerHTML = need ? `<div class="banner"><span class="e">💾</span>
    <p><b>${cfg.lastBackup ? `Hai ${daysSince(cfg.lastBackup)} días que non gardas copia` : 'Aínda non gardaches ningunha copia'}</b><br>Gárdaa en Drive ou no correo por se cambias de móbil.</p>
    <div class="btns"><button class="primary" id="bkNow">Gardar agora</button><button class="secondary" id="bkLater">Máis tarde</button></div></div>` : '';
  if (need) {
    $('bkNow').onclick = () => $('exportJson').click();
    $('bkLater').onclick = () => { cfg.backupSnooze = today(); save(); renderBanner(); };
  }
}

// Débenme: o que adiantaches e aínda non che devolveron (de todos os meses)
function renderOwed() {
  const pend = gastos.filter(g => g.owed && !g.owed.paid);
  $('owedCard').hidden = !pend.length;
  if (!pend.length) return;
  const by = {};
  pend.forEach(g => (by[g.owed.who] ||= []).push(g));
  $('owedTotal').textContent = eur(pend.reduce((s, g) => s + g.amount, 0));
  $('owedList').innerHTML = Object.entries(by).map(([who, items]) => {
    const t = items.reduce((s, g) => s + g.amount, 0);
    return `<div class="owed-person"><div class="owed-head"><div class="chip" style="background:color-mix(in srgb, var(--warn) 16%, transparent)">👪</div>
      <div class="info"><b>${esc(who)}</b><small>${items.length} ${items.length === 1 ? 'cousa pendente' : 'cousas pendentes'}</small></div><span class="amt">${eur(t)}</span></div>
      ${items.sort((a, b) => b.date.localeCompare(a.date)).map(g => {
        const d = new Date(g.date + 'T12:00').toLocaleDateString('gl-ES', { day: 'numeric', month: 'short' });
        return `<div class="owed-item"><span>${d} · ${esc(g.desc || catInfo(g.cat)[2])}</span><b>${eur(g.amount)}</b><button data-paid="${g.id}">✓ Devolto</button></div>`;
      }).join('')}
      ${items.length > 1 ? `<button class="owed-all" data-paidall="${esc(who)}">Devolvéronme todo (${eur(t)})</button>` : ''}</div>`;
  }).join('');
}
$('owedList').onclick = e => {
  const one = e.target.closest('[data-paid]'), all = e.target.closest('[data-paidall]');
  if (one) {
    const g = gastos.find(g => g.id === +one.dataset.paid);
    g.owed.paid = true; g.owed.paidDate = today();
  } else if (all) {
    const who = all.dataset.paidall;
    if (!confirm(`Marcar como devolto todo o de ${who}?`)) return;
    gastos.forEach(g => { if (g.owed && !g.owed.paid && g.owed.who === who) { g.owed.paid = true; g.owed.paidDate = today(); } });
  } else return;
  save(); render();
};

function render() {
  renderBanner();
  renderOwed();
  const key = monthKey();
  $('monthLabel').textContent = view.toLocaleDateString('gl-ES', { month: 'short', year: 'numeric' }).replace('.', '');
  const cur = monthData(key), prev = monthData(addMonths(key, -1));

  $('total').textContent = eur(cur.expTotal);
  const p = pct(cur.expTotal, prev.expTotal);
  $('sumCmp').textContent = p === null ? 'Sen datos do mes anterior' : `${p > 0 ? '▲' : p < 0 ? '▼' : '='} ${Math.abs(p)} % que o mes anterior`;
  $('sumInc').textContent = eur(cur.incTotal);
  const bal = cur.incTotal - cur.expTotal;
  $('sumBal').textContent = (bal > 0 ? '+' : '') + eur(bal);
  $('sumBal').className = bal < 0 ? 'up' : bal > 0 ? 'down' : '';

  // Orzamento total
  if (cfg.budget > 0) {
    const f = cur.expTotal / cfg.budget, left = cfg.budget - cur.expTotal, lvl = levelClass(f);
    const [y, m] = key.split('-').map(Number);
    const dim = new Date(y, m, 0).getDate();
    let foot = '';
    if (key === today().slice(0, 7) && left > 0) {
      const daysLeft = dim - new Date().getDate() + 1;
      foot = `<div class="budget-foot">Podes gastar uns <b>${eur(left / daysLeft)}</b> ao día ata fin de mes</div>`;
    }
    $('budget').innerHTML = `<div class="budget-head"><div><span class="big">${eur(cur.expTotal)}</span> <span class="of">de ${eur(cfg.budget)}</span></div>
      <span class="pill ${lvl}">${left >= 0 ? 'Quedan ' + eur(left) : 'Pasácheste ' + eur(-left)}</span></div>
      <div class="bar big"><span class="${lvl}" style="width:${Math.min(f, 1) * 100}%"></span></div>${foot}`;
  } else {
    $('budget').innerHTML = '<div class="empty"><span class="e">🎯</span>Aínda non tes orzamento.<br>Toca «Axustar» para poñer un límite mensual.</div>';
  }

  // Por categoría
  const cats = new Set([...Object.keys(cur.byCat), ...Object.keys(cfg.catBudgets).filter(c => cfg.catBudgets[c] > 0)]);
  const rows = [...cats].map(c => [c, cur.byCat[c] || 0]).sort((a, b) => b[1] - a[1]);
  $('byCat').innerHTML = rows.length ? (cur.expTotal ? donut(rows, cur.expTotal) : '') + rows.map(([c, v]) => {
    const info = catInfo(c);
    const lim = cfg.catBudgets[c];
    const cmp = pctTag(v, prev.byCat[c]);
    let bar, sub;
    if (lim > 0) {
      const f = v / lim;
      bar = `<span class="${levelClass(f)}" style="width:${Math.min(f, 1) * 100}%"></span>`;
      sub = `de ${eur(lim)}${f >= 1 ? ' · ⚠️ superado' : ''}`;
    } else {
      bar = `<span style="background:${info[3]};width:${cur.expTotal ? (v / cur.expTotal * 100).toFixed(1) : 0}%"></span>`;
      sub = cur.expTotal ? `${Math.round(v / cur.expTotal * 100)} % do total` : '';
    }
    return `<div class="cat-row">${chip(info)}<span class="name">${info[2]}</span><span class="val">${eur(v)}</span>
      <div class="line2"><div class="bar">${bar}</div><span>${sub}${cmp ? ' · ' + cmp : ''}</span></div></div>`;
  }).join('') : '<div class="empty"><span class="e">🍩</span>Aquí verás en que se vai o teu diñeiro.</div>';

  // Movementos agrupados por día
  const list = [...cur.items].sort((a, b) => b.date.localeCompare(a.date) || b.id - a.id);
  if (list.length) {
    const groups = {};
    list.forEach(g => (groups[g.date] ||= []).push(g));
    const t = today(), yest = new Date(Date.now() - 864e5); yest.setMinutes(yest.getMinutes() - yest.getTimezoneOffset());
    const y = yest.toISOString().slice(0, 10);
    $('list').innerHTML = Object.entries(groups).map(([d, items]) => {
      const label = d === t ? 'Hoxe' : d === y ? 'Onte' : new Date(d + 'T12:00').toLocaleDateString('gl-ES', { weekday: 'long', day: 'numeric', month: 'short' });
      const net = items.reduce((s, g) => s + (g.owed ? 0 : isInc(g) ? g.amount : -g.amount), 0);
      return `<div class="day"><span>${label}</span><span>${net > 0 ? '+' : ''}${eur(net)}</span></div>` + items.map(g => {
        const info = catInfo(g.cat);
        return `<div class="item" data-id="${g.id}">${chip(info)}
          <div class="info"><div class="desc">${esc(g.desc || info[2])}</div><div class="meta">${info[2]}${g.recId ? '<span class="tag">🔁 fixo</span>' : ''}${g.owed ? `<span class="tag ${g.owed.paid ? 'done' : 'pend'}">👪 ${esc(g.owed.who)} · ${g.owed.paid ? 'devolto' : 'pendente'}</span>` : ''}</div></div>
          <div class="amt ${isInc(g) ? 'inc' : g.owed ? 'owed' : ''}">${isInc(g) ? '+' : '−'}${eur(g.amount)}</div><button class="del" data-del="${g.id}" aria-label="Borrar">${TRASH}</button></div>`;
      }).join('');
    }).join('');
  } else {
    $('list').innerHTML = '<div class="empty"><span class="e">🧾</span>Non hai movementos este mes.<br>Toca «Engadir» para apuntar o primeiro.</div>';
  }

  // Fixos
  $('recList').innerHTML = cfg.recurrentes.length ? cfg.recurrentes.map(r => {
    const info = catInfo(r.cat);
    return `<div class="item">${chip(info)}
      <div class="info"><div class="desc">${esc(r.desc || info[2])}</div><div class="meta">O día ${r.day} de cada mes</div></div>
      <div class="amt ${r.type === 'ingreso' ? 'inc' : ''}">${r.type === 'ingreso' ? '+' : '−'}${eur(r.amount)}</div>
      <button class="del" data-delrec="${r.id}" aria-label="Deixar de repetir">${CROSS}</button></div>`;
  }).join('') : '<div class="empty"><span class="e">🔁</span>Marca «Repetir cada mes» ao engadir un movemento<br>(alugueiro, Netflix, nómina…).</div>';
}

// Formulario de movemento
function renderForm() {
  document.querySelectorAll('#typeSeg button').forEach(b => b.classList.toggle('sel', b.dataset.type === selType));
  $('cats').innerHTML = CATS[selType].map(c =>
    `<button type="button" data-cat="${c[0]}" class="${c[0] === selCat ? 'sel' : ''}">${chip(c)}${c[2]}</button>`).join('');
  $('desc').placeholder = selType === 'ingreso' ? 'Ex.: nómina de novembro' : 'Ex.: compra no super';
  updateOwedUI();
}
function updateOwedUI() {
  $('owedWrap').hidden = selType === 'ingreso';
  $('owedFields').hidden = selType === 'ingreso' || !$('owed').checked;
}
$('owed').onchange = updateOwedUI;

// Descricións xa usadas: cantas veces, e a última categoría e importe de cada unha
function knownDescs(type) {
  const map = new Map();
  [...gastos].sort((a, b) => a.date.localeCompare(b.date) || a.id - b.id).forEach(g => {
    if (!g.desc || (g.type || 'gasto') !== type) return;
    const k = g.desc.toLowerCase();
    const e = map.get(k) || { n: 0 };
    map.set(k, { n: e.n + 1, desc: g.desc, cat: g.cat, amount: g.amount });
  });
  return [...map.values()].sort((a, b) => b.n - a.n);
}
let suggestions = [];
function renderSuggestions(isNew) {
  suggestions = knownDescs(selType);
  $('descList').innerHTML = suggestions.slice(0, 50).map(s => `<option value="${esc(s.desc)}">`).join('');
  const top = isNew ? suggestions.filter(s => s.n >= 2).slice(0, 6) : [];
  $('quick').innerHTML = top.map((s, i) =>
    `<button type="button" data-q="${i}">${catInfo(s.cat)[1]} ${esc(s.desc)} <b>${eur(s.amount)}</b></button>`).join('');
}
function applySuggestion(s, force) {
  $('desc').value = s.desc;
  if (CATS[selType].some(c => c[0] === s.cat)) selCat = s.cat;
  if (force || !$('amount').value) $('amount').value = s.amount;
  renderForm();
}
$('quick').onclick = e => {
  const b = e.target.closest('[data-q]');
  if (b) applySuggestion(suggestions.filter(s => s.n >= 2)[+b.dataset.q], true);
};
$('desc').addEventListener('input', () => {
  const s = suggestions.find(s => s.desc.toLowerCase() === $('desc').value.trim().toLowerCase());
  if (s && !editingId) applySuggestion(s, false);
});
function openForm(g, type) {
  editingId = g ? g.id : null;
  $('formTitle').textContent = g ? 'Editar movemento' : 'Novo movemento';
  $('amount').value = g ? g.amount : '';
  $('desc').value = g ? g.desc : '';
  const def = monthKey() === today().slice(0, 7) ? today() : monthKey() + '-01';
  $('date').value = g ? g.date : def;
  selType = g ? (g.type || 'gasto') : (type === 'ingreso' ? 'ingreso' : 'gasto');
  selCat = g ? g.cat : CATS[selType][0][0];
  $('repeat').checked = false;
  $('repeatWrap').hidden = !!g;
  const whos = [...new Set(gastos.filter(x => x.owed).sort((a, b) => b.id - a.id).map(x => x.owed.who))];
  $('whoList').innerHTML = whos.map(w => `<option value="${esc(w)}">`).join('');
  $('owed').checked = !!(g && g.owed);
  $('owedWho').value = g && g.owed ? g.owed.who : (whos[0] || 'Pais');
  $('owedPaid').checked = !!(g && g.owed && g.owed.paid);
  renderForm();
  renderSuggestions(!g);
  $('dlg').showModal();
  if (!g) setTimeout(() => $('amount').focus(), 50);
}
$('add').onclick = () => openForm();
$('cancel').onclick = () => $('dlg').close();
$('typeSeg').onclick = e => {
  const b = e.target.closest('[data-type]');
  if (b && b.dataset.type !== selType) { selType = b.dataset.type; selCat = CATS[selType][0][0]; renderForm(); renderSuggestions(!editingId); }
};
$('cats').onclick = e => { const b = e.target.closest('[data-cat]'); if (b) { selCat = b.dataset.cat; renderForm(); } };
$('form').onsubmit = e => {
  const amount = Math.round(parseFloat(String($('amount').value).replace(',', '.')) * 100) / 100;
  if (!(amount > 0) || !$('date').value) { e.preventDefault(); return; }
  const data = { type: selType, amount, cat: selCat, desc: $('desc').value.trim(), date: $('date').value };
  if (selType === 'gasto' && $('owed').checked) {
    const paid = $('owedPaid').checked;
    const prevO = editingId ? gastos.find(g => g.id === editingId).owed : null;
    data.owed = { who: $('owedWho').value.trim() || 'Pais', paid, paidDate: paid ? (prevO && prevO.paidDate) || today() : null };
  }
  if (editingId) {
    const t = gastos.find(g => g.id === editingId);
    Object.assign(t, data);
    if (!data.owed) delete t.owed;
  } else if ($('repeat').checked) {
    const m = data.date.slice(0, 7);
    const r = { id: newId(), type: data.type, amount, cat: data.cat, desc: data.desc, day: +data.date.slice(8, 10), last: addMonths(m, -1) };
    cfg.recurrentes.push(r);
    if (m <= today().slice(0, 7)) { gastos.push({ id: newId(), ...data, recId: r.id }); r.last = m; }
    runRecurring();
  } else {
    gastos.push({ id: newId(), ...data });
  }
  save();
  const [y, mo] = data.date.split('-'); view = new Date(+y, +mo - 1, 1);
  render();
};
$('list').onclick = e => {
  const del = e.target.closest('[data-del]');
  if (del) {
    if (confirm('Borrar este movemento?')) { gastos = gastos.filter(g => g.id !== +del.dataset.del); save(); render(); }
    return;
  }
  const it = e.target.closest('.item');
  if (it) openForm(gastos.find(g => g.id === +it.dataset.id));
};
$('recList').onclick = e => {
  const b = e.target.closest('[data-delrec]');
  if (b && confirm('Deixar de repetir este movemento? Os xa apuntados quedan.')) {
    cfg.recurrentes = cfg.recurrentes.filter(r => r.id !== +b.dataset.delrec); save(); render();
  }
};

// Pechar as follas tocando fóra
document.querySelectorAll('dialog').forEach(d => d.addEventListener('click', e => { if (e.target === d) d.close(); }));

// Orzamento
$('editBudget').onclick = () => {
  $('budgetTotal').value = cfg.budget || '';
  $('budgetCats').innerHTML = CATS.gasto.map(c =>
    `<span class="n">${chip(c)}${c[2]}</span><input type="number" inputmode="decimal" min="0" step="1" data-bcat="${c[0]}" placeholder="—" value="${cfg.catBudgets[c[0]] || ''}">`).join('');
  $('budgetDlg').showModal();
};
$('budgetCancel').onclick = () => $('budgetDlg').close();
$('budgetForm').onsubmit = () => {
  cfg.budget = parseFloat($('budgetTotal').value) || 0;
  cfg.catBudgets = {};
  document.querySelectorAll('[data-bcat]').forEach(i => { const v = parseFloat(i.value); if (v > 0) cfg.catBudgets[i.dataset.bcat] = v; });
  save(); render();
};

$('prev').onclick = () => { view.setMonth(view.getMonth() - 1); render(); };
$('next').onclick = () => { view.setMonth(view.getMonth() + 1); render(); };

// Copias
function download(name, text, type) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], { type }));
  a.download = name; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
$('exportCsv').onclick = () => {
  const rows = [['Data', 'Tipo', 'Categoría', 'Descrición', 'Importe']].concat(
    [...gastos].sort((a, b) => a.date.localeCompare(b.date)).map(g =>
      [g.date, isInc(g) ? 'Ingreso' : g.owed ? `Adiantado (${g.owed.who}, ${g.owed.paid ? 'devolto' : 'pendente'})` : 'Gasto', catInfo(g.cat)[2], g.desc, (isInc(g) ? g.amount : -g.amount).toFixed(2).replace('.', ',')]));
  download('gastos.csv', '﻿' + rows.map(r => r.map(v => `"${String(v).replace(/"/g, '""')}"`).join(';')).join('\n'), 'text/csv');
};
$('exportJson').onclick = async () => {
  const name = `gastos-copia-${today()}.json`, text = JSON.stringify({ version: 2, gastos, config: cfg });
  // No móbil, ofrece compartir (Drive, Gmail, WhatsApp…); se non, descarga
  const file = typeof File === 'function' ? new File([text], name, { type: 'application/json' }) : null;
  if (file && navigator.canShare && navigator.canShare({ files: [file] })) {
    try { await navigator.share({ files: [file], title: 'Copia dos meus gastos' }); }
    catch (err) { if (err.name === 'AbortError') return; download(name, text, 'application/json'); }
  } else download(name, text, 'application/json');
  cfg.lastBackup = today(); save(); renderBanner();
};
$('importJson').onchange = async e => {
  const f = e.target.files[0]; if (!f) return;
  try {
    const data = JSON.parse(await f.text());
    const items = Array.isArray(data) ? data : data.gastos;
    if (!Array.isArray(items)) throw 0;
    if (confirm(`Restaurar ${items.length} movementos? Substituirá os datos actuais.`)) {
      gastos = items;
      if (!Array.isArray(data) && data.config) cfg = Object.assign({ budget: 0, catBudgets: {}, recurrentes: [] }, data.config);
      save(); runRecurring(); render();
    }
  } catch { alert('O ficheiro non é unha copia válida.'); }
  e.target.value = '';
};

runRecurring();
render();

// Atallos desde a icona (manter premida): ?novo=gasto / ?novo=ingreso
const novo = new URLSearchParams(location.search).get('novo');
if (novo) { history.replaceState(null, '', location.pathname); openForm(null, novo); }

// Modo app: funcionar sen internet e pedir que o navegador non borre os datos
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
</script>
